services:
  web:
    build: .
    container_name: news_retriever
    ports:
      - "8000:8000"
    environment:
      - ZHIPU_API_KEY=51d907fcfdaa44a7a84272860e27812e2.YExdW68diEJYtC8d
      - TZ=Asia/Shanghai
    restart: always 
    networks:
      - app-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cf_tunnel
    command: tunnel --url http://web:8000 --protocol http2
    restart: always 
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge