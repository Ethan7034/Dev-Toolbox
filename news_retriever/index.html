<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Retriever System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .notice-board {
            background-color: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .notice-board b {
            color: var(--text-main);
        }

        .auth-panel {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .auth-panel input {
            width: 80%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--bg-color);
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            outline: none;
        }

        .auth-panel button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 0 5px;
        }

        .auth-panel button:hover {
            background-color: var(--accent-hover);
        }

        .auth-panel .register-btn {
            background-color: transparent;
            border: 1px solid var(--text-muted);
        }

        .search-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        button.search-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button.search-btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .results {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .results li {
            background-color: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            line-height: 1.6;
        }

        .source-tag {
            color: #3b82f6;
            font-size: 12px;
            margin-right: 8px;
            font-weight: bold;
        }

        .error-msg {
            border-left-color: var(--danger) !important;
            color: #fca5a5;
        }

        .status-bar {
            text-align: right;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            text-decoration: underline;
        }

        @media screen and (max-width: 768px) {

            body,
            .container {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 10px !important;
                box-sizing: border-box !important;
            }

            h1 {
                font-size: 22px !important;
                text-align: center !important;
                margin: 15px 0 !important;
            }

            .notice-board,
            .status-bar,
            .search-wrapper {
                width: 100% !important;
                box-sizing: border-box !important;
                margin-bottom: 15px !important;
            }

            .status-bar {
                text-align: center !important;
            }

            .search-wrapper {
                flex-direction: column !important;
                gap: 10px !important;
            }

            .search-wrapper input,
            .search-wrapper button {
                width: 100% !important;
            }

            .results {
                width: 100% !important;
            }

            .results li {
                display: flex !important;
                flex-direction: column !important;
                align-items: flex-start !important;
                width: 100% !important;
                box-sizing: border-box !important;
                padding: 12px !important;
                font-size: 14px !important;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="notice-board">
            <p>🕒 <b>Server SLA Window:</b> 10:30 - 22:30 (Daily, UTC+8) | 服务器开放时间：每日 10:30 - 22:30（北京时间）</p>
            <p>💡 <b>Tip:</b> Please use your browser's translation tool if needed. | 提示：请自行开启浏览器翻译功能。</p>
        </div>

        <div id="statusBar" class="status-bar" style="display: none;">
            Logged in as: <b id="currentUserDisplay"></b>
            <button class="logout-btn" onclick="logout()">Logout / 登出</button>
        </div>

        <div id="authPanel" class="auth-panel">
            <h2>🔐 System Access</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">请登录后使用检索功能（默认Default: admin / 123456）</p>
            <input type="text" id="authUsername" placeholder="Username / 用户名">
            <input type="password" id="authPassword" placeholder="Password / 密码">
            <div>
                <button onclick="login()">Login / 登录</button>
                <button class="register-btn" onclick="register()">Register / 注册</button>
            </div>
        </div>

        <div id="searchPanel" style="display: none;">
            <h1>📡 News Retriever Engine</h1>
            <div class="search-wrapper">
                <input type="text" id="keywordInput" placeholder="Enter keyword (e.g., AI, 经济)..."
                    onkeypress="if(event.key === 'Enter') searchNews()">
                <button class="search-btn" id="searchBtn" onclick="searchNews()">Search</button>
            </div>
        </div>
        <div id="historyPanel" style="display: none; margin-bottom: 20px;">
            <span style="color: var(--text-muted); font-size: 14px; margin-right: 10px;">🕒 Recent Searches:</span>
            <div id="historyTags" style="display: inline-flex; gap: 8px; flex-wrap:wrap;"></div>
        </div>
    </div>
    <ul class="results" id="resultsList"></ul>
    </div>
    </div>

    <script>
        window.onload = () => {
            const token = localStorage.getItem('token');
            if (token) {
                showSearchPanel(token);
            }
        };

        function showSearchPanel(token) {
            const username = token.replace("token_for_", "");
            document.getElementById('currentUserDisplay').innerText = username;
            document.getElementById('statusBar').style.display = 'block';
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('searchPanel').style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('token');
            location.reload();
        }

        async function login() {
            const user = document.getElementById('authUsername').value.trim();
            const pwd = document.getElementById('authPassword').value.trim();
            if (!user || !pwd) return alert("请输入用户名和密码");

            const formData = new URLSearchParams();
            formData.append('username', user);
            formData.append('password', pwd);

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Login failed");

                localStorage.setItem('token', data.access_token);
                alert("✅ 登录成功！");
                showSearchPanel(data.access_token);

            } catch (error) {
                alert(`❌ 登录失败: ${error.message}`);
            }
        }

        async function register() {
            const user = document.getElementById('authUsername').value.trim();
            const pwd = document.getElementById('authPassword').value.trim();
            if (!user || !pwd) return alert("请输入用户名和密码");

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pwd })
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Registration failed");
                alert("✅ 注册成功！请点击登录。");

            } catch (error) {
                alert(`❌ 注册失败: ${error.message}`);
            }
        }
        async function loadHistory() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/api/history', { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                const tagsDiv = document.getElementById('historyTags');
                tagsDiv.innerHTML = '';

                if (data.history && data.history.length > 0) {
                    document.getElementById('historyPanel').style.display = 'block';
                    data.history.forEach(item => {
                        const tag = document.createElement('span');
                        tag.innerText = item.keyword;
                        tag.style.cssText = "background: #334155; padding: 4px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.2s;";
                        tag.onmouseover = () => tag.style.background = "#475569";
                        tag.onmouseout = () => tag.style.background = "#334155";

                        tag.onclick = () => {
                            document.getElementById('keywordInput').value = item.keyword;
                            searchNews();
                        };
                        tagsDiv.appendChild(tag);
                    });
                }
            } catch (e) { console.error("History load failed", e); }
        }


        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) loadHistory();
        });
        async function searchNews() {
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) return;

            const token = localStorage.getItem('token');
            if (!token) return logout();

            const btn = document.getElementById('searchBtn');
            const list = document.getElementById('resultsList');

            btn.disabled = true; btn.innerText = "Searching...";
            list.innerHTML = '<li>Fetching data...</li>';

            try {
                const response = await fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    alert("❌ Invalid token. Please log in again.\n❌凭证已过期，请重新登录");
                    return logout();
                }

                if (response.status === 503) {
                    throw new Error("❌The service is currently closed.\n❌服务器已关闭（服务时间：10:30 ~ 22:30）")
                }

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Failed to fetch data");
                }

                const data = await response.json();
                list.innerHTML = '';

                if (data.data && data.data.length > 0) {
                    data.data.forEach(newsItem => {
                        const li = document.createElement('li');

                        let sentimentColor = "#f59e0b";
                        let sentimentText = "[ WARN ]";

                        if (newsItem.sentiment_label === "Positive") {
                            sentimentColor = "#10b981";
                            sentimentText = "[ PASS ]";
                        } else if (newsItem.sentiment_label === "Negative") {
                            sentimentColor = "#ef4444";
                            sentimentText = "[ FAIL ]";
                        }

                        li.innerHTML = `
                            <span style="color: ${sentimentColor}; font-weight: bold; margin-right: 8px; font-family: monospace;">
                                ${sentimentText}
                            </span>
                            <span class="source-tag">[${newsItem.source}]</span> 
                            <a href="${newsItem.url}" target="_blank" style="color: var(--text-main); text-decoration: none; border-bottom: 1px dashed #94a3b8; transition: 0.2s;" onmouseover="this.style.color='#3b82f6'" onmouseout="this.style.color='var(--text-main)'">
                                ${newsItem.title}
                            </a >
                        `;

                        list.appendChild(li);
                    });
                    loadHistory();
                } else {
                    list.innerHTML = '<li>No news found.</li>';
                }
            } finally {
                btn.disabled = false; btn.innerText = "Search";
            }
        }
        window.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem("token")) loadHistory();
        });
    </script>
</body>

</html>
